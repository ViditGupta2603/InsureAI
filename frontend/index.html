<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsureAI</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">
    <div class="card">

        <h1>🚀 InsureAI</h1>
        <p class="subtitle">Smart Insurance Cost Predictor</p>

        <!-- FORM -->
        <div class="form">
            <input id="age" type="number" placeholder="Enter Age">
            <input id="bmi" type="number" placeholder="Enter BMI">
            <input id="children" type="number" placeholder="Children">

            <button onclick="predict()">Predict Cost</button>
        </div>

        <!-- LOADER -->
        <div id="loader" style="display:none;">Loading...</div>

        <!-- RESULT -->
        <div id="result"></div>

        <!-- ERROR -->
        <div id="error" style="color:red;"></div>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
